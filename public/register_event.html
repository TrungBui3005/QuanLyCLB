<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sự kiện CLB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --accent-color: #4cc9f0;
            --bg-color: #f8f9fa;
        }

        body { 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Header Styling */
        .page-header {
            background: white;
            padding: 2rem 0;
            margin-bottom: 3rem;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            border-bottom: 1px solid #edf2f7;
        }

        /* Card Styling */
        .event-card { 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border-radius: 20px; 
            border: none; 
            overflow: hidden; 
            background: #fff;
            position: relative;
        }

        .event-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.12) !important; 
        }

        /* Banner giả lập cho card sinh động hơn */
        .card-banner {
            height: 120px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            position: relative;
        }

        .card-banner::after {
            content: "\f073";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            bottom: -20px;
            right: 25px;
            font-size: 3rem;
            color: rgba(255,255,255,0.2);
        }

        .card-title { 
            font-weight: 800; 
            color: #2d3436;
            line-height: 1.4;
            min-height: 50px;
        }

        .event-info {
            background: #f1f3f9;
            border-radius: 12px;
            padding: 12px;
        }

        .event-info i { 
            width: 25px; 
            color: var(--primary-color); 
        }

        .btn-join { 
            border-radius: 12px; 
            font-weight: 700; 
            padding: 12px;
            transition: all 0.3s;
            border: none;
            background: linear-gradient(to right, #4361ee, #3f37c9);
        }

        .btn-join:hover {
            filter: brightness(1.1);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        .admin-notice { 
            background-color: #dcfce7; 
            color: #166534; 
            border: 1px solid #bbf7d0; 
            border-radius: 12px; 
            padding: 10px;
        }

        .badge-date {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--primary-color);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-extrabold m-0" style="color: #2d3748;">
                        <i class="fas fa-layer-group me-2 text-primary"></i>Sự kiện CLB
                    </h2>
                    <p class="text-muted m-0 mt-1">Khám phá và tham gia các hoạt động mới nhất</p>
                </div>
                <a href="index.html" class="btn btn-outline-dark px-4 rounded-pill fw-bold">
                    <i class="fas fa-arrow-left me-2"></i>Trang chủ
                </a>
            </div>
        </div>
    </div>

    <div class="container pb-5">
        <div id="eventContainer" class="row g-4">
            <!-- Hiệu ứng Loading khi chờ API -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
                <p class="mt-3 text-muted fw-500">Đang đồng bộ dữ liệu sự kiện...</p>
            </div>
        </div>
    </div>

    <script>
    const user = JSON.parse(localStorage.getItem('user'));

    async function loadEvents() {
        try {
            // 1. Lấy danh sách tất cả sự kiện[cite: 5, 7]
            const resEvents = await fetch('index.php/event/list');
            const events = await resEvents.json();

            // 2. Lấy danh sách ID các sự kiện mà User này đã tham gia (nếu đã đăng nhập)
            let joinedEventIds = [];
if (user) {
    try {
        const resJoined = await fetch(`index.php/registration/my-activities?user_id=${user.id}`);
        const joinedData = await resJoined.json();
        
        // Kiểm tra xem joinedData có thực sự là mảng không trước khi map
        if (Array.isArray(joinedData)) {
            joinedEventIds = joinedData.map(item => parseInt(item.event_id));
        } else {
            console.warn("Dữ liệu trả về không phải mảng:", joinedData);
            // Nếu API trả về {status: "success", data: [...]}, hãy dùng:
            // joinedEventIds = joinedData.data.map(item => parseInt(item.event_id));
        }
    } catch (err) {
        console.warn("Không thể lấy danh sách đã tham gia:", err);
    }
}

            const container = document.getElementById('eventContainer');
            
            if (events.length === 0) {
                container.innerHTML = `<div class="col-12 text-center py-5"><p class="text-muted">Chưa có sự kiện nào.</p></div>`;
                return;
            }

            container.innerHTML = events.map(ev => {
                const isJoined = joinedEventIds.includes(parseInt(ev.id)); // Kiểm tra xem đã tham gia chưa
                
                let actionButton = "";
                if (user && user.role.toLowerCase() === 'admin') {
                    actionButton = `<div class="admin-notice text-center small fw-bold"><i class="fas fa-user-shield me-1"></i> Chế độ Quản trị viên</div>`;
                } else if (isJoined) {
                    // Nếu đã tham gia: Đổi màu nút và disable để tránh nhầm lẫn
                    actionButton = `<button class="btn btn-secondary w-100 btn-join shadow-sm" disabled>
                                        <i class="fas fa-check-circle me-2"></i> Đã gửi yêu cầu
                                    </button>`;
                } else {
                    // Nếu chưa tham gia: Hiện nút bình thường
                    actionButton = `<button onclick="joinEvent(${ev.id})" class="btn btn-primary w-100 btn-join shadow-sm">
                                        Tham gia ngay <i class="fas fa-chevron-right ms-2 small"></i>
                                    </button>`;
                }

                const dateObj = new Date(ev.event_date);
                const formattedDate = dateObj.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });

                return `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 event-card shadow-sm">
                            <div class="card-banner">
                                <span class="badge-date"><i class="far fa-calendar-alt me-1"></i> ${formattedDate}</span>
                            </div>
                            <div class="card-body d-flex flex-column p-4">
                                <h5 class="card-title mb-1 text-truncate-2">${ev.title}</h5>
                                <p class="text-primary small fw-bold mb-2">
                                    <i class="fas fa-users me-1"></i> ${ev.club_name || 'CLB Hệ thống'}
                                </p>
                                <p class="card-text text-muted small flex-grow-1 mb-4">
                                    ${ev.description.substring(0, 100)}${ev.description.length > 100 ? '...' : ''}
                                </p>
                                <div class="event-info mb-4">
                                    <div class="mb-2 d-flex align-items-center">
                                        <i class="fas fa-map-marker-alt"></i> 
                                        <span class="small text-dark fw-medium">${ev.location}</span>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <i class="far fa-clock"></i> 
                                        <span class="small text-dark fw-medium">
                                            ${dateObj.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })} - ${formattedDate}
                                        </span>
                                    </div>
                                </div>
                                <div class="mt-auto">${actionButton}</div>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        } catch (error) {
            console.error("Lỗi tải sự kiện:", error);
            document.getElementById('eventContainer').innerHTML = '<div class="col-12 text-center text-danger">Lỗi kết nối Server.</div>';
        }
    }

    async function joinEvent(eventId) {
        if (!user) {
            alert("Vui lòng đăng nhập để đăng ký tham gia!");
            return;
        }

        const response = await fetch('index.php/registration/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ event_id: eventId, user_id: user.id })
        });

        const result = await response.json();
        if (result.status === "success") {
            alert("Đăng ký thành công!");
            loadEvents(); // Tải lại danh sách để cập nhật trạng thái nút ngay lập tức
        } else {
            alert("Lỗi: " + result.message);
        }
    }

    loadEvents();
</script>
</body>
</html>
